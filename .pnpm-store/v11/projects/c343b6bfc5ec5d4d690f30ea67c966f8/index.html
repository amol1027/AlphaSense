    <title>AlphaSense — Market behavior, in time</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      // Mirrors the logic in src/theme.ts: stored choice wins, else OS.
      try {
        var saved = window.localStorage.getItem('alphasense-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* defaults from CSS apply */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
